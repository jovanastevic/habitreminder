<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Companion</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Habit Companion</h1>
        <p class="status" id="statusText">
          <span class="status-dot-wrap">
            <span class="status-dot-ping"></span>
            <span class="status-dot"></span>
          </span>
          Connecting...
        </p>
      </div>
      <div class="avatar">
        <!-- device-mobile Icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <rect
            x="7"
            y="2"
            width="10"
            height="20"
            rx="2"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <circle cx="12" cy="18.3" r="0.9" fill="currentColor" />
        </svg>
      </div>
    </header>

    <main>
      <section class="card">
        <h2>
          <!-- plus-circle Icon -->
          <svg
            class="icon-blue"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
          >
            <circle cx="12" cy="12" r="10" fill="currentColor" />
            <path
              d="M12 8v8M8 12h8"
              stroke="#fff"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          Set New Habit
        </h2>
        <form id="habitForm">
          <div class="field">
            <label>What do you want to track?</label>
            <input
              type="text"
              id="habitName"
              required
              placeholder="e.g., Drink Water"
            />
          </div>
          <div class="grid-2">
            <div class="field">
              <label>Time</label>
              <input type="time" id="habitTime" required value="14:00" />
            </div>
            <div class="field">
              <label>Melody</label>
              <select id="habitMelody">
                <option value="Reminder">Reminder</option>
                <option value="Success">Success</option>
              </select>
            </div>
          </div>
          <button type="submit">Sync to Device</button>
        </form>
      </section>

      <section>
        <div class="list-header">
          <h2>Active Habits</h2>
          <span class="badge" id="habitCount">0/6</span>
        </div>
        <div id="habitList"></div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
